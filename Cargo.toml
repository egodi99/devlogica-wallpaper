[package]
name = "devlogica-wallpaper"
version = "0.1.0"
edition = "2021"
description = "Sfondi animati DevLogica per Windows e macOS, con supporto multimonitor"

[dependencies]
wgpu = "30"
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "0.26"
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_Graphics_Gdi",
] }
winreg = "0.55"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "objc2-core-foundation"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Icona e informazioni dell'eseguibile Windows (richiede gli strumenti di compilazione Microsoft).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
